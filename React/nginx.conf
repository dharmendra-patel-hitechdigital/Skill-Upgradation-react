# Serves the built SPA. Sits behind the ALB, which terminates TLS and does the
# /api/* path routing - so this server never needs to know the API's address.

# Trust the ALB's X-Forwarded-For so access logs show the client IP rather than
# the load balancer's private address. The ALB always overwrites the last hop,
# so this cannot be spoofed from outside the VPC.
set_real_ip_from 10.0.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json
           image/svg+xml application/manifest+json;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nothing here should advertise its version to a scanner.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ALB target-group health check. Answered by nginx directly so a broken
    # bundle still reports healthy only if the server itself is up - the deeper
    # "does the app work" signal belongs to the API's /health/ready.
    #
    # access_log off because the ALB polls this every 15s from every AZ, and
    # those lines would otherwise drown real traffic in CloudWatch.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json always;
        return 200 '{"status":"ok"}';
    }

    # Vite emits content-hashed filenames under /assets, so these are immutable:
    # a changed file is a changed URL. Long max-age here is what makes a redeploy
    # cheap for returning users.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # index.html must never be cached, or browsers keep loading the old bundle's
    # asset URLs after a deploy and the app breaks until a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Client-side routing: unknown paths are React Router's problem, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
