# Alembic configuration.
#
# The database URL is deliberately NOT set here - `alembic/env.py` reads it from
# the application settings and converts it to a blocking driver. That keeps one
# DATABASE_URL as the single source of truth for the app and for migrations.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Timestamped, slugged revision filenames sort chronologically in the directory,
# which makes review far easier than opaque hashes alone.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# Uncomment to auto-format generated migrations (requires ruff installed).
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
