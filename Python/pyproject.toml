[project]
name = "intelligent-document-service"
version = "2.0.0"
description = "Async FastAPI backend with JWT auth and AI-powered document processing"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# `asyncio_mode = auto` means async test functions and async fixtures need no
# per-item decorator, which keeps the suite readable.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI's Depends()/File() in defaults is the documented idiom
    "RUF012", # ClassVar annotations not required for this codebase's style
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "RUF043"]
# Alembic revisions are machine-generated and regenerated on demand; reformatting
# them by hand only creates diff noise against the next autogenerate.
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
