[project]
name = "intelligent-document-service"
version = "2.0.0"
description = "Async FastAPI backend with JWT auth and AI-powered document processing"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# `asyncio_mode = auto` means async test functions and async fixtures need no
# per-item decorator, which keeps the suite readable.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# `tests/` has no __init__.py, so pytest's default prepend import mode puts
# `tests/` on sys.path rather than the project root - and conftest.py imports
# both `app.*` and `tests.pdf_builder`, which then resolve to nothing.
#
# It works when invoked as `python -m pytest`, which adds the cwd itself, and
# fails on the bare `pytest` console script, which does not. The container runs
# the console script, so CI hit "ModuleNotFoundError: No module named 'app'"
# (pytest exit 4) where local runs were green. Setting it here makes both paths
# behave the same.
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI's Depends()/File() in defaults is the documented idiom
    "RUF012", # ClassVar annotations not required for this codebase's style
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "RUF043"]
# Alembic revisions are machine-generated and regenerated on demand; reformatting
# them by hand only creates diff noise against the next autogenerate.
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
