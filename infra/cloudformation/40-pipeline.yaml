AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Skill-Upgradation CI/CD: CodePipeline driving three CodeBuild projects.

    Source  ->  Build (api ‖ web, in parallel)  ->  Migrate  ->  Deploy (api ‖ web)

  Migrate is its own stage between build and deploy so the schema is current
  before any new task starts, and so a failed migration stops the release
  instead of half-applying it across a rolling deploy.

Parameters:
  ProjectName:
    Type: String
    Default: skill-upgradation
    AllowedPattern: "^[a-z][a-z0-9-]{2,30}$"

  GitHubOwner:
    Type: String
    Description: GitHub user or organisation that owns the repository.

  GitHubRepo:
    Type: String
    Description: Repository name only, without the owner prefix.

  GitHubBranch:
    Type: String
    Default: main

  CodeStarConnectionArn:
    Type: String
    Default: ""
    Description: >
      Existing CodeConnections ARN. Leave blank and the stack creates one - but a
      new connection is created in PENDING state and CANNOT be completed by
      CloudFormation. You must finish the GitHub OAuth handshake by hand in the
      console (Developer Tools > Settings > Connections) before the first run.

  ViteApiBaseUrl:
    Type: String
    Default: /api/v1
    Description: >
      Baked into the SPA bundle at build time. The default is same-origin, which
      is what the ALB routing in 30-services.yaml is set up for.

  NotificationEmail:
    Type: String
    Default: ""
    Description: Optional. Subscribes to pipeline failure notifications.

Conditions:
  CreateConnection: !Equals [!Ref CodeStarConnectionArn, ""]
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]

Resources:
  # --------------------------------------------------------------- source link
  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Condition: CreateConnection
    Properties:
      ConnectionName: !Sub "${ProjectName}-github"
      ProviderType: GitHub

  # ------------------------------------------------------------ artifact store
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-pipeline-artifacts-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          # Build artifacts are only useful until the next run; without this the
          # bucket grows by an image-definitions zip per commit forever.
          - Id: expire-artifacts
            Status: Enabled
            ExpirationInDays: 30
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 3 }

  # ------------------------------------------------------------- codebuild iam
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codebuild"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}-*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              # Publishing the pytest report declared in the buildspec. Without
              # these the build fails at the report-upload step with
              # AccessDeniedException, having already passed its tests. The
              # report group is created on first use and named
              # "<project>-pytest", so the ARN can be scoped rather than "*".
              - Effect: Allow
                Action:
                  - codebuild:CreateReportGroup
                  - codebuild:CreateReport
                  - codebuild:UpdateReport
                  - codebuild:BatchPutTestCases
                  - codebuild:BatchPutCodeCoverages
                Resource: !Sub "arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/*"
              # GetAuthorizationToken is account-wide by definition - it returns
              # a registry token, not a per-repository one, so it cannot be
              # scoped. The push/pull actions below are scoped.
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource:
                  - !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-api"
                  - !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-web"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - Fn::ImportValue: !Sub "${ProjectName}-DbSecretArn"
              # Required for a CodeBuild project with VpcConfig: the service
              # creates and tears down an ENI in the private subnet per build.
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeDhcpOptions
                  - ec2:DescribeVpcs
                Resource: "*"
              - Effect: Allow
                Action: ec2:CreateNetworkInterfacePermission
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
                Condition:
                  StringEquals:
                    "ec2:Subnet":
                      - !Sub
                        - "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${SubnetId}"
                        - SubnetId: !ImportValue
                            Fn::Sub: "${ProjectName}-PrivateSubnetA"
                      - !Sub
                        - "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${SubnetId}"
                        - SubnetId: !ImportValue
                            Fn::Sub: "${ProjectName}-PrivateSubnetB"
                    "ec2:AuthorizedService": codebuild.amazonaws.com

  # ------------------------------------------------------------ build projects
  ApiBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectName}-api-build"
      Description: Lint, test, and build the FastAPI image.
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Source:
        Type: CODEPIPELINE
        BuildSpec: Python/buildspec.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        # Required to run `docker build` inside the build container.
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: ECR_REPOSITORY_URI
            Value:
              Fn::ImportValue: !Sub "${ProjectName}-ApiRepositoryUri"
          # Must match the container name in 30-services.yaml.
          - Name: CONTAINER_NAME
            Value: api
      Cache:
        Type: LOCAL
        Modes: [LOCAL_DOCKER_LAYER_CACHE, LOCAL_CUSTOM_CACHE]
      TimeoutInMinutes: 30
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub "/aws/codebuild/${ProjectName}-api-build"

  WebBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectName}-web-build"
      Description: Build the React SPA and package it behind nginx.
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Source:
        Type: CODEPIPELINE
        BuildSpec: React/buildspec.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: ECR_REPOSITORY_URI
            Value:
              Fn::ImportValue: !Sub "${ProjectName}-WebRepositoryUri"
          - Name: CONTAINER_NAME
            Value: web
          - Name: VITE_API_BASE_URL
            Value: !Ref ViteApiBaseUrl
      Cache:
        Type: LOCAL
        Modes: [LOCAL_DOCKER_LAYER_CACHE, LOCAL_CUSTOM_CACHE]
      TimeoutInMinutes: 20
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub "/aws/codebuild/${ProjectName}-web-build"

  MigrateProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectName}-migrate"
      Description: Apply Alembic migrations to RDS before the new tasks roll out.
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Source:
        Type: CODEPIPELINE
        BuildSpec: infra/buildspec/migrate.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: false           # no docker here, so no privilege needed
        EnvironmentVariables:
          - Name: DB_HOST
            Value:
              Fn::ImportValue: !Sub "${ProjectName}-DbEndpoint"
          - Name: DB_PORT
            Value:
              Fn::ImportValue: !Sub "${ProjectName}-DbPort"
          - Name: DB_NAME
            Value:
              Fn::ImportValue: !Sub "${ProjectName}-DbName"
          - Name: DB_USER
            Value:
              Fn::ImportValue: !Sub "${ProjectName}-DbUsername"
          # SECRETS_MANAGER type: CodeBuild resolves "<arn>:<json-key>" itself
          # and masks the value in the build log. Doing this here rather than in
          # the buildspec's `secrets-manager` block is what lets the ARN come
          # from a stack import.
          - Name: DB_PASSWORD
            Type: SECRETS_MANAGER
            Value: !Sub
              - "${SecretArn}:password"
              - SecretArn: !ImportValue
                  Fn::Sub: "${ProjectName}-DbSecretArn"
      # RDS is not publicly accessible, so this build has to run inside the VPC.
      # Private subnets only - a public subnet has no NAT route, and the build
      # would hang trying to reach PyPI and Secrets Manager.
      VpcConfig:
        VpcId:
          Fn::ImportValue: !Sub "${ProjectName}-VpcId"
        Subnets:
          - Fn::ImportValue: !Sub "${ProjectName}-PrivateSubnetA"
          - Fn::ImportValue: !Sub "${ProjectName}-PrivateSubnetB"
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${ProjectName}-BuildSecurityGroupId"
      TimeoutInMinutes: 15
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub "/aws/codebuild/${ProjectName}-migrate"

  # ------------------------------------------------------------- pipeline iam
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codepipeline"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource:
                  - !GetAtt ApiBuildProject.Arn
                  - !GetAtt WebBuildProject.Arn
                  - !GetAtt MigrateProject.Arn
              - Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !If
                  - CreateConnection
                  - !Ref GitHubConnection
                  - !Ref CodeStarConnectionArn
              # The ECS deploy action reads the current service and task
              # definition, registers a new revision with the built image, and
              # calls UpdateService.
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                  - ecs:TagResource
                Resource: "*"
              # UpdateService needs to hand the task's roles to ECS. Scoped to
              # the two roles the task definitions actually use, so this cannot
              # be turned into a privilege-escalation path.
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-ecs-execution"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-ecs-task-api"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-ecs-task-web"
                Condition:
                  StringEquals:
                    "iam:PassedToService": ecs-tasks.amazonaws.com

  # ------------------------------------------------------------------ pipeline
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${ProjectName}-pipeline"
      RoleArn: !GetAtt PipelineRole.Arn
      # V2 supports git tag/branch filters and per-execution modes; V1 does not.
      PipelineType: V2
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !If
                  - CreateConnection
                  - !Ref GitHubConnection
                  - !Ref CodeStarConnectionArn
                FullRepositoryId: !Sub "${GitHubOwner}/${GitHubRepo}"
                BranchName: !Ref GitHubBranch
                # Webhook-driven. Set false to fall back to polling.
                DetectChanges: true
              OutputArtifacts:
                - Name: SourceOutput
              RunOrder: 1

        # Both builds share RunOrder 1, so CodePipeline runs them concurrently.
        # The API build is the slow one (install, lint, tests); the SPA build
        # finishes well inside it, so the stage costs roughly one API build.
        - Name: Build
          Actions:
            - Name: BuildApi
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref ApiBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: ApiBuildOutput
              RunOrder: 1
            - Name: BuildWeb
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref WebBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: WebBuildOutput
              RunOrder: 1

        - Name: Migrate
          Actions:
            - Name: AlembicUpgrade
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref MigrateProject
              InputArtifacts:
                - Name: SourceOutput
              RunOrder: 1

        - Name: Deploy
          Actions:
            - Name: DeployApi
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ECS
                Version: "1"
              Configuration:
                ClusterName:
                  Fn::ImportValue: !Sub "${ProjectName}-ClusterName"
                ServiceName:
                  Fn::ImportValue: !Sub "${ProjectName}-ApiServiceName"
                FileName: imagedefinitions.json
                # Fail the action rather than reporting success while tasks are
                # still stabilising. The service's circuit breaker rolls back.
                DeploymentTimeout: "15"
              InputArtifacts:
                - Name: ApiBuildOutput
              RunOrder: 1
            - Name: DeployWeb
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ECS
                Version: "1"
              Configuration:
                ClusterName:
                  Fn::ImportValue: !Sub "${ProjectName}-ClusterName"
                ServiceName:
                  Fn::ImportValue: !Sub "${ProjectName}-WebServiceName"
                FileName: imagedefinitions.json
                DeploymentTimeout: "10"
              InputArtifacts:
                - Name: WebBuildOutput
              RunOrder: 1

  # -------------------------------------------------------------- notifications
  NotificationTopic:
    Type: AWS::SNS::Topic
    Condition: HasNotificationEmail
    Properties:
      TopicName: !Sub "${ProjectName}-pipeline-alerts"
      Subscription:
        - Protocol: email
          Endpoint: !Ref NotificationEmail

  # EventBridge, not a CodePipeline notification rule, because this needs no
  # extra AWS Chatbot/Codestar-notifications setup to work.
  PipelineFailureRule:
    Type: AWS::Events::Rule
    Condition: HasNotificationEmail
    Properties:
      Name: !Sub "${ProjectName}-pipeline-failed"
      Description: Email on a failed pipeline execution.
      EventPattern:
        source: ["aws.codepipeline"]
        detail-type: ["CodePipeline Pipeline Execution State Change"]
        detail:
          state: ["FAILED"]
          pipeline: [!Ref Pipeline]
      Targets:
        - Arn: !Ref NotificationTopic
          Id: sns

  NotificationTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: HasNotificationEmail
    Properties:
      Topics: [!Ref NotificationTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref NotificationTopic

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  PipelineUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view?region=${AWS::Region}"
  ConnectionArn:
    Description: >
      If this stack created the connection, open it in the console and complete
      the GitHub handshake - it stays PENDING and the pipeline cannot run until
      you do.
    Value: !If [CreateConnection, !Ref GitHubConnection, !Ref CodeStarConnectionArn]
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
