AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Skill-Upgradation platform layer: VPC, subnets, ALB, ECR repositories and the
  ECS cluster. Everything here is long-lived - deploy it once per environment
  and leave it alone. The service and pipeline stacks import from it.

Parameters:
  ProjectName:
    Type: String
    Default: skill-upgradation
    Description: Prefix for every resource name and the export namespace.
    AllowedPattern: "^[a-z][a-z0-9-]{2,30}$"

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: >
      Must stay in sync with the set_real_ip_from directive in React/nginx.conf,
      which trusts this range as the load balancer.

  SingleNatGateway:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      One NAT Gateway (~$32/mo) instead of one per AZ. Cheaper, but the second
      AZ loses egress if the first AZ fails. Set false for production.

Conditions:
  UseSingleNat: !Equals [!Ref SingleNatGateway, "true"]
  UseSecondNat: !Equals [!Ref SingleNatGateway, "false"]

Resources:
  # ------------------------------------------------------------------ network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      # Required for RDS private DNS names and for ECR/S3 interface endpoints
      # to resolve inside the VPC.
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-igw"

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Public subnets hold only the ALB and the NAT gateways.
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]   # 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-a"

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]   # 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-b"

  # Private subnets hold the ECS tasks, RDS, and the migration CodeBuild
  # project. Nothing here is reachable from the internet.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]   # 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-private-a"

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 8]]   # 10.0.3.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-private-b"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-rt"

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # --------------------------------------------------------------------- NAT
  NatEipA:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-nat-a"

  NatEipB:
    Type: AWS::EC2::EIP
    Condition: UseSecondNat
    DependsOn: AttachGateway
    Properties:
      Domain: vpc

  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Condition: UseSecondNat
    Properties:
      AllocationId: !GetAtt NatEipB.AllocationId
      SubnetId: !Ref PublicSubnetB
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-nat-b"

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-private-rt-a"

  PrivateDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  PrivateSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTableA

  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-private-rt-b"

  PrivateDefaultRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [UseSingleNat, !Ref NatGatewayA, !Ref NatGatewayB]

  PrivateSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTableB

  # S3 traffic (document storage, ECR layer downloads, CodePipeline artifacts)
  # is high-volume. A gateway endpoint keeps it off the NAT gateway, where it
  # would be billed per GB - this endpoint is free and usually pays for the
  # whole stack on its own.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTableA
        - !Ref PrivateRouteTableB

  # ------------------------------------------------------------ security groups
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} public load balancer"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from the internet
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS from the internet
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-alb-sg"

  # Tasks accept traffic ONLY from the ALB's security group - referencing the
  # group rather than a CIDR means this stays correct if the subnets change.
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} ECS tasks"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: API traffic from the ALB
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: SPA traffic from the ALB
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-service-sg"

  # The migration CodeBuild project gets its own group so the database can
  # distinguish "the app is connecting" from "the pipeline is connecting".
  BuildSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} CodeBuild migration runner"
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-build-sg"

  # ------------------------------------------------------------ load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-alb"
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      LoadBalancerAttributes:
        # Must exceed the API's own keep-alive, or the ALB reuses a connection
        # the server has already closed and the client sees a spurious 502.
        - Key: idle_timeout.timeout_seconds
          Value: "70"
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-alb"

  # Target groups live in the service stack, so this listener starts with a
  # fixed response and the service stack attaches rules to it. Doing it the
  # other way round would make the two stacks mutually dependent.
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "404"
            ContentType: application/json
            MessageBody: '{"error":{"code":"not_found","message":"No route matched."}}'

  # ------------------------------------------------------------------- ECR
  # ImageScanningConfiguration surfaces CVEs on push; the lifecycle policy stops
  # the repository growing without bound, since every commit pushes a new tag.
  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-api"
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 20 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              }
            ]
          }

  WebRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-web"
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 20 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # ------------------------------------------------------------------- ECS
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-cluster"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub "${ProjectName}-VpcId" }
  VpcCidr:
    Value: !Ref VpcCidr
    Export: { Name: !Sub "${ProjectName}-VpcCidr" }
  PublicSubnets:
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    Export: { Name: !Sub "${ProjectName}-PublicSubnets" }
  PrivateSubnetA:
    Value: !Ref PrivateSubnetA
    Export: { Name: !Sub "${ProjectName}-PrivateSubnetA" }
  PrivateSubnetB:
    Value: !Ref PrivateSubnetB
    Export: { Name: !Sub "${ProjectName}-PrivateSubnetB" }
  PrivateSubnets:
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
    Export: { Name: !Sub "${ProjectName}-PrivateSubnets" }
  ServiceSecurityGroupId:
    Value: !Ref ServiceSecurityGroup
    Export: { Name: !Sub "${ProjectName}-ServiceSecurityGroupId" }
  BuildSecurityGroupId:
    Value: !Ref BuildSecurityGroup
    Export: { Name: !Sub "${ProjectName}-BuildSecurityGroupId" }
  HttpListenerArn:
    Value: !Ref HttpListener
    Export: { Name: !Sub "${ProjectName}-HttpListenerArn" }
  LoadBalancerDns:
    Description: Open this in a browser once the service stack is deployed.
    Value: !Sub "http://${LoadBalancer.DNSName}"
    Export: { Name: !Sub "${ProjectName}-LoadBalancerDns" }
  ClusterName:
    Value: !Ref Cluster
    Export: { Name: !Sub "${ProjectName}-ClusterName" }
  ApiRepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
    Export: { Name: !Sub "${ProjectName}-ApiRepositoryUri" }
  WebRepositoryUri:
    Value: !GetAtt WebRepository.RepositoryUri
    Export: { Name: !Sub "${ProjectName}-WebRepositoryUri" }
