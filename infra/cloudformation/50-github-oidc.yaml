AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lets GitHub Actions assume an AWS role via OIDC, so no long-lived access key
  is ever stored in GitHub secrets. GitHub presents a short-lived signed token;
  STS exchanges it for credentials that expire in an hour.

  This is the whole reason to prefer OIDC: a leaked repository secret containing
  an AWS_SECRET_ACCESS_KEY is valid until someone notices and rotates it. A
  leaked OIDC token is useless minutes later, and only ever worked from the one
  repository and branch named in the trust policy below.

Parameters:
  ProjectName:
    Type: String
    Default: skill-upgradation
    AllowedPattern: "^[a-z][a-z0-9-]{2,30}$"

  GitHubOwner:
    Type: String
    Description: GitHub user or organisation that owns the repository.

  GitHubRepo:
    Type: String
    Description: Repository name only, without the owner prefix.

  AllowedRefPattern:
    Type: String
    Default: "refs/heads/main"
    Description: >
      Which git ref may assume this role. Keep it narrow - it is the only thing
      stopping a pull request from a fork, or a throwaway branch, from deploying
      to production. Matched with StringLike, so "*" works:
        refs/heads/main    only main (default, recommended)
        refs/tags/v*       only version tags
        refs/heads/*       any branch - do not use for production

  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      An AWS account can hold only ONE provider per URL. Set false if another
      stack in this account already created the GitHub provider, and pass its
      ARN as ExistingOidcProviderArn.

  ExistingOidcProviderArn:
    Type: String
    Default: ""

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  # No ThumbprintList: IAM manages GitHub's certificate thumbprints for this
  # well-known provider itself. Pinning one by hand used to be required and is
  # now just a rotation outage waiting to happen.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-github-actions"
      Description: Assumed by GitHub Actions to build, push, and deploy.
      # One hour: long enough for a slow ECS rollout to finish, short enough
      # that a stolen token is worthless by the time it is used.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                # Without this, ANY GitHub repository in the world could assume
                # the role - the provider is shared across all of GitHub.
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
              StringLike:
                "token.actions.githubusercontent.com:sub": !Sub
                  "repo:${GitHubOwner}/${GitHubRepo}:ref:${AllowedRefPattern}"
      Policies:
        - PolicyName: ecr-push
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Returns a registry-wide token by definition, so it cannot be
              # scoped to a repository. The layer actions below are scoped.
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource:
                  - !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-api"
                  - !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-web"

        - PolicyName: ecs-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                  # RunTask is how migrations execute: a one-off task in the
                  # private subnets, since GitHub's runners cannot reach RDS.
                  - ecs:RunTask
                  - ecs:StopTask
                  - ecs:TagResource
                Resource: "*"
              # UpdateService and RunTask both hand the task's roles to ECS.
              # Scoped to exactly the three roles the task definitions use, so
              # this cannot become a privilege-escalation path.
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-ecs-execution"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-ecs-task-api"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-ecs-task-web"
                Condition:
                  StringEquals:
                    "iam:PassedToService": ecs-tasks.amazonaws.com

        - PolicyName: read-stack-outputs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The workflow reads subnet ids and the cluster name from stack
              # exports rather than duplicating them as GitHub variables, so
              # there is one source of truth for the environment's topology.
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:ListExports
                Resource: "*"
              - Effect: Allow
                Action: logs:GetLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${ProjectName}/*"

Outputs:
  DeployRoleArn:
    Description: Set this as the GitHub repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
    Export: { Name: !Sub "${ProjectName}-GitHubDeployRoleArn" }
  OidcProviderArn:
    Value: !If [MakeProvider, !Ref GitHubOidcProvider, !Ref ExistingOidcProviderArn]
