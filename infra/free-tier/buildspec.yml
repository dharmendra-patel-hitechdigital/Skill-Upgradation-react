# Free-tier CI/CD: test, build both images, ship the compose bundle, deploy via
# SSM Run Command.
#
# Build logic is delegated to scripts/ci.sh, shared with the production
# buildspecs and the GitHub Actions workflows. What is genuinely specific here
# is the deploy mechanism: an SSM command against a single EC2 instance.
#
# Everything runs in one CodeBuild project because the free allowance is 100
# build-minutes/month on general1.small. Choices follow from that: one action
# instead of four stages, local Docker layer cache on, and no separate runtime
# installs since the tests run inside the image.
#
# Required environment (set by infra/free-tier/cloudformation/20-pipeline.yaml):
#   PROJECT_NAME, API_REPOSITORY_URI, WEB_REPOSITORY_URI, DEPLOY_BUCKET,
#   PUBLIC_ORIGIN

version: 0.2

env:
  variables:
    VITE_API_BASE_URL: "/api/v1"

phases:
  pre_build:
    commands:
      - echo "--- ecr login ---"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$API_REPOSITORY_URI"
      - IMAGE_TAG=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-$CODEBUILD_BUILD_NUMBER}" | cut -c 1-12)
      # ci.sh composes "<registry>/<project>-api", so it needs the registry host
      # on its own. PROJECT_NAME already arrives from the pipeline stack.
      - export REGISTRY="${API_REPOSITORY_URI%/*}"
      - echo "Registry $REGISTRY, project $PROJECT_NAME, tag $IMAGE_TAG"

  build:
    commands:
      # Lint and tests inside the image's own `test` stage. The runtime layers
      # are shared, so the subsequent build is mostly cache hits.
      - ./scripts/ci.sh test
      - ./scripts/ci.sh build "$IMAGE_TAG"
      - ./scripts/ci.sh push "$IMAGE_TAG"

  post_build:
    commands:
      # The nginx routing config is shared with the local stack rather than
      # duplicated, so local and deployed routing cannot drift.
      - cp infra/local/edge.nginx.conf infra/free-tier/compose/edge.nginx.conf
      # Build-time values deploy.sh needs. Shipped in the bundle rather than as
      # SSM command arguments, which would mean nesting quotes three levels deep
      # inside the --parameters JSON.
      - printf 'PUBLIC_ORIGIN=%s\n' "$PUBLIC_ORIGIN" > infra/free-tier/compose/build.env
      - echo "--- shipping compose bundle ---"
      - aws s3 sync infra/free-tier/compose/ "s3://${DEPLOY_BUCKET}/compose/" --delete

      # Find the target by tag, so replacing the instance never requires a
      # pipeline change.
      - |
        INSTANCE_ID=$(aws ec2 describe-instances \
          --filters "Name=tag:DeployTarget,Values=${PROJECT_NAME}" \
                    "Name=instance-state-name,Values=running" \
          --query 'Reservations[0].Instances[0].InstanceId' --output text)
        if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
          echo "No running instance tagged DeployTarget=${PROJECT_NAME}." >&2
          echo "Deploy infra/free-tier/cloudformation/10-platform.yaml first." >&2
          exit 1
        fi
        echo "Deploying to ${INSTANCE_ID}"

      # SSM Run Command rather than CodeDeploy: no agent config, no appspec, and
      # it is free. Amazon Linux 2023 ships the SSM agent, and the instance role
      # already carries AmazonSSMManagedInstanceCore.
      - |
        CMD_ID=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name AWS-RunShellScript \
          --comment "Deploy ${IMAGE_TAG}" \
          --timeout-seconds 900 \
          --parameters commands="[
              'aws s3 cp s3://${DEPLOY_BUCKET}/compose/deploy.sh /opt/app/deploy.sh',
              'chmod +x /opt/app/deploy.sh',
              '/opt/app/deploy.sh ${IMAGE_TAG}'
            ]" \
          --query 'Command.CommandId' --output text)
        echo "SSM command ${CMD_ID}"

        # Poll to completion so a failed deploy fails the pipeline. Without this
        # the build goes green the moment the command is merely accepted.
        STATUS=Pending
        for _ in $(seq 1 60); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text 2>/dev/null || echo Pending)
          echo "  status: $STATUS"
          case "$STATUS" in
            Success|Failed|Cancelled|TimedOut) break ;;
          esac
          sleep 15
        done

        echo "--- deploy output ---"
        aws ssm get-command-invocation --command-id "$CMD_ID" \
          --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text || true

        if [ "$STATUS" != "Success" ]; then
          echo "--- deploy stderr ---" >&2
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text >&2 || true
          exit 1
        fi
      - echo "Deployed ${IMAGE_TAG}"
