# Runs ON the EC2 instance. Deployed by deploy.sh, which writes the .env.runtime
# file that supplies every variable below.
#
# There is no `build:` here and no `db:` service: images come from ECR, and the
# database is the free-tier RDS instance. This file is the free-tier counterpart
# of the ECS task definitions in infra/cloudformation/30-services.yaml, and the
# topology matches deliberately - one origin, /api/* to the API, everything else
# to the SPA. Here nginx does the routing that the ALB does there.

name: skill-upgradation

services:
  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      # Discrete parts, assembled into DATABASE_URL by app/core/config.py - which
      # also percent-encodes the password, so a generated one with "#" or "/" in
      # it cannot corrupt the URL.
      DB_HOST: ${DB_HOST}
      DB_PORT: "3306"
      DB_NAME: appdb
      DB_USER: appadmin
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DIALECT: mysql
      SECRET_KEY: ${SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Alembic owns the schema; deploy.sh runs `alembic upgrade head` before
      # this container starts.
      AUTO_CREATE_TABLES: "false"
      # Local disk, not S3. Correct here precisely because there is exactly one
      # instance - the moment you run a second, this has to become s3 or an
      # upload handled by one host becomes invisible to the other.
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /app/var/documents
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
      LOG_JSON: "true"
      LOG_LEVEL: INFO
    volumes:
      - document-data:/app/var
    # 1 GB of RAM total. Without a cap, a runaway API process takes nginx and
    # the SPA down with it; with one, Docker kills only the offender.
    mem_limit: 640m
    logging:
      driver: json-file
      # Log rotation matters more than usual on a 20 GB disk with no log agent
      # shipping anything off the box.
      options: { max-size: "10m", max-file: "3" }

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    mem_limit: 64m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  edge:
    # The one image in this bundle that does not come from ECR, so it is the one
    # that can be rate-limited. A Docker Hub 429 here fails the *deploy* after
    # the build and tests already passed, on an instance nobody is watching, so
    # it pulls from the ECR Public mirror by default too.
    image: ${NGINX_IMAGE:-public.ecr.aws/docker/library/nginx:1.27-alpine}
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - "80:80"
    volumes:
      - ./edge.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  document-data:
