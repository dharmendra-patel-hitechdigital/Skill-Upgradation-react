AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Skill-Upgradation free-tier platform: one t3.micro EC2 running the whole stack
  under Docker Compose, plus a db.t4g.micro RDS instance. Deliberately avoids
  the three things that make the Fargate design cost money - NAT Gateway, ALB,
  and Fargate itself - none of which have any free allowance.

  Uses its own VPC CIDR (10.1.0.0/16) so it can run alongside the production
  stacks in the same account without colliding.

Parameters:
  ProjectName:
    Type: String
    Default: skill-upgradation-free
    AllowedPattern: "^[a-z][a-z0-9-]{2,30}$"

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t2.micro, t3.micro, t3.small]
    Description: >
      t3.micro is free-tier eligible in most regions; a few older ones offer
      t2.micro instead. t3.small is NOT free - only pick it if 1 GB proves too
      tight and you accept the cost.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: >
      Resolved at deploy time from the AWS-published SSM parameter, so the
      instance always launches on a current Amazon Linux 2023 image.

  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: >
      RDS master password. Store the SAME value in SSM Parameter Store as
      /<ProjectName>/DB_PASSWORD (SecureString) before deploying - CloudFormation
      cannot create SecureString parameters, so that step is manual. See the
      README. Generate one with:
        python -c "import secrets; print(secrets.token_urlsafe(24))"

  DbEngineVersion:
    Type: String
    Default: "8.4.6"

  DbBackupRetentionDays:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 35
    Description: >
      Days of automated backups. Accounts on the 2025 credit-based Free Plan are
      capped well below the old default of 7 and reject anything higher with
      "backup retention period exceeds the maximum available to free tier
      customers" - so this defaults to 1. Set 0 to disable automated backups
      entirely if even 1 is refused; set 7 or more on a paid account.

  AllowedHttpCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: >
      Lock this to your own IP while testing - the instance serves plain HTTP,
      so anything sent to it (including a login password) is readable in transit.

Resources:
  # ------------------------------------------------------------------ network
  # No NAT Gateway anywhere in this template. The instance sits in a public
  # subnet and reaches the internet through the Internet Gateway directly, which
  # is free; a NAT Gateway would be ~$32/month on its own.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.1.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-igw" }]

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.1.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-public" }]

  # RDS requires a subnet group spanning two AZs even for a single-AZ instance.
  # These have no route to the Internet Gateway and need none - the database
  # only ever talks to the EC2 instance.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.1.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-private-a" }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.1.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-private-b" }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-public-rt" }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ---------------------------------------------------------- security groups
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} application host"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedHttpCidr
          Description: HTTP
      # No SSH rule on purpose. Shell access is via SSM Session Manager, which
      # needs no open port, no key pair, and is covered by the free tier.
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-instance-sg" }]

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} RDS MySQL"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref InstanceSecurityGroup
          Description: MySQL from the application host only
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-db-sg" }]

  # ---------------------------------------------------------------------- rds
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} database subnets"
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Metadata:
      cfn-lint:
        config:
          # W1011 wants a dynamic reference such as
          # {{resolve:secretsmanager:...}} instead of a NoEcho parameter. The
          # production stack (infra/cloudformation/20-data.yaml) does exactly
          # that. Here it would mean a Secrets Manager secret at $0.40/month,
          # which defeats the point of this template. A NoEcho parameter is
          # masked in the console and in describe-stacks; the accepted cost is
          # that the value passes through your shell once.
          ignore_checks: [W1011]
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-mysql"
      Engine: mysql
      EngineVersion: !Ref DbEngineVersion
      # Free tier covers 750 hours/month of db.t2/t3/t4g.micro and 20 GB of
      # storage for 12 months. Both values below stay inside that.
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      StorageType: gp2
      DBName: appdb
      MasterUsername: appadmin
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      StorageEncrypted: true
      MultiAZ: false                  # Multi-AZ is not free-tier eligible
      # Not hard-coded: the Free Plan caps this, and a value above the cap fails
      # the whole stack. See the DbBackupRetentionDays parameter.
      BackupRetentionPeriod: !Ref DbBackupRetentionDays
      # Storage autoscaling is deliberately NOT enabled: it would silently grow
      # past the 20 GB free allowance and start billing.
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-mysql" }]

  # ------------------------------------------------------------------- images
  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-api"
      ImageScanningConfiguration: { ScanOnPush: true }
      # ECR's free allowance is 500 MB. These images are ~200 MB each, so old
      # tags have to be expired aggressively or the repo bills within weeks.
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the 3 most recent images (500MB free tier)",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 3
                },
                "action": { "type": "expire" }
              }
            ]
          }

  WebRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-web"
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the 3 most recent images (500MB free tier)",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 3
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # Holds the compose file and nginx config the instance pulls on each deploy.
  # A few KB - comfortably inside the 5 GB S3 free allowance.
  DeployBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-deploy-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  # ---------------------------------------------------------------------- iam
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-instance"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Enables Session Manager shell access and Run Command deploys.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: pull-and-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - !GetAtt ApiRepository.Arn
                  - !GetAtt WebRepository.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !GetAtt DeployBucket.Arn
                  - !Sub "${DeployBucket.Arn}/*"
              # Application secrets live in Parameter Store, which is free for
              # Standard parameters - Secrets Manager would be $0.40 each.
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/*"
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ProjectName}-instance"
      Roles: [!Ref InstanceRole]

  # ----------------------------------------------------------------- instance
  Instance:
    Type: AWS::EC2::Instance
    # No explicit DependsOn: the UserData below reads
    # !GetAtt Database.Endpoint.Address, which already orders RDS first.
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref InstanceSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            # Free tier allows 30 GB of EBS; 20 leaves headroom for a second
            # instance without tipping into billing.
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-host"
        # The pipeline finds the instance by this tag rather than by a hard-coded
        # id, so replacing the instance does not require editing the pipeline.
        - Key: DeployTarget
          Value: !Ref ProjectName
      # Deliberately minimal: this installs Docker and writes a config file, and
      # nothing else. The deploy logic lives in infra/free-tier/compose/deploy.sh
      # as a real, reviewable, syntax-checkable file that the pipeline ships to
      # S3 - embedding it here would mean every shell ${VAR} had to be escaped
      # against Fn::Sub, which is exactly how these scripts rot.
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          dnf install -y docker

          # 1 GB of RAM is genuinely tight for Python + nginx + image pulls.
          # Swap turns a hard OOM-kill during `docker compose pull` into mere
          # slowness - the difference between a failed deploy and a slow one.
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=2048
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          systemctl enable --now docker
          usermod -aG docker ec2-user

          # Amazon Linux 2023 ships Docker without the Compose v2 plugin.
          # Pinned rather than "latest" so a rebuilt instance behaves identically.
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL \
            "https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-x86_64" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          mkdir -p /opt/app

          # Everything deploy.sh needs to know about this environment. Written
          # once at launch; the script itself stays environment-agnostic.
          cat > /opt/app/app.env <<'CONFIG'
          AWS_REGION=${AWS::Region}
          PROJECT_NAME=${ProjectName}
          DEPLOY_BUCKET=${DeployBucket}
          ECR_REGISTRY=${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
          DB_HOST=${Database.Endpoint.Address}
          CONFIG
          chmod 600 /opt/app/app.env

          # Brings the stack back after a reboot or stop/start. ConditionPathExists
          # makes it a no-op before the first pipeline run has delivered the
          # script, so a fresh instance does not fail its first boot.
          cat > /etc/systemd/system/app-stack.service <<'UNIT'
          [Unit]
          Description=Skill-Upgradation application stack
          Requires=docker.service
          After=docker.service network-online.target
          ConditionPathExists=/opt/app/deploy.sh

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/opt/app/deploy.sh
          TimeoutStartSec=900

          [Install]
          WantedBy=multi-user.target
          UNIT

          systemctl daemon-reload
          systemctl enable app-stack.service

  # An Elastic IP keeps the address stable across stop/start - without one, a
  # stopped instance comes back on a different public IP. It is free while
  # associated with a RUNNING instance, and billed hourly when it is not.
  ElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-eip" }]

Outputs:
  ApplicationUrl:
    Description: Open this once the first pipeline run has deployed the images.
    Value: !Sub "http://${ElasticIp}"
  InstanceId:
    Value: !Ref Instance
    Export: { Name: !Sub "${ProjectName}-InstanceId" }
  SessionManagerUrl:
    Description: Browser shell on the instance - no SSH key or open port needed.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/systems-manager/session-manager/${Instance}?region=${AWS::Region}"
  DbEndpoint:
    Value: !GetAtt Database.Endpoint.Address
    Export: { Name: !Sub "${ProjectName}-DbEndpoint" }
  DeployBucketName:
    Value: !Ref DeployBucket
    Export: { Name: !Sub "${ProjectName}-DeployBucketName" }
  ApiRepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
    Export: { Name: !Sub "${ProjectName}-ApiRepositoryUri" }
  WebRepositoryUri:
    Value: !GetAtt WebRepository.RepositoryUri
    Export: { Name: !Sub "${ProjectName}-WebRepositoryUri" }
