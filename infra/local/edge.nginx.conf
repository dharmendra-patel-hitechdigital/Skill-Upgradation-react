# Stands in for the Application Load Balancer in the local stack.
#
# It exists so that "works locally" means the same thing as "works on AWS": the
# same single origin, the same /api/* split, so the SPA can be built with
# VITE_API_BASE_URL=/api/v1 in both places and CORS never enters the picture.
# Without this, local development runs cross-origin and hides an entire class of
# bug until the first deploy.
#
# Mirrors infra/cloudformation/30-services.yaml listener rules:
#   /api/*, /docs, /redoc, /openapi.json  -> api:8000
#   everything else                       -> web:80

upstream api_upstream {
    server api:8000;
}

upstream web_upstream {
    server web:80;
}

server {
    listen 80;
    server_name _;

    # Matches the ALB's idle_timeout so a long upload behaves the same locally.
    proxy_read_timeout 70s;
    client_max_body_size 25m;   # a little above the API's MAX_UPLOAD_SIZE_MB=20

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # The API runs with --proxy-headers, so it reads these to reconstruct the
    # original scheme and client IP rather than reporting the proxy's.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    location /api/ {
        proxy_pass http://api_upstream;
    }

    # FastAPI serves its docs outside the /api prefix.
    location /docs {
        proxy_pass http://api_upstream;
    }

    location /redoc {
        proxy_pass http://api_upstream;
    }

    location = /openapi.json {
        proxy_pass http://api_upstream;
    }

    location / {
        proxy_pass http://web_upstream;
    }
}
