# Full local stack: MySQL + FastAPI + React SPA behind one origin.
#
#   docker compose up --build
#   open http://localhost:8080          the app
#   open http://localhost:8080/docs     the API
#
# The `edge` service plays the part of the ALB, so the local topology matches
# infra/cloudformation/30-services.yaml: one origin, /api/* routed to the API,
# everything else to the SPA. That is what lets the SPA be built with the same
# same-origin VITE_API_BASE_URL locally and on AWS.
#
# Python/docker-compose.yml still exists and is the right choice when you only
# want the backend. This file is for the whole system.

name: skill-upgradation

services:
  db:
    # ECR Public mirror by default, for the same reason as the Dockerfiles:
    # Docker Hub's anonymous pull limit is per source IP, so a shared network
    # (CI, an office, a VPN) can exhaust it for everyone. Override with
    # MYSQL_IMAGE=mysql:8.4 to pull from Docker Hub instead.
    image: ${MYSQL_IMAGE:-public.ecr.aws/docker/library/mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Python/db/schema_mysql.sql is deliberately NOT mounted into
      # /docker-entrypoint-initdb.d. It is a DBA-facing alternative to Alembic,
      # not a companion to it: it would create the tables on first boot, and the
      # `alembic upgrade head` below would then fail on `CREATE TABLE users`
      # because the initial migration is not written with IF NOT EXISTS.
      # Alembic owns the schema here, exactly as it does on AWS.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./Python
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      # Supplied as discrete parts, the same way the ECS task definition does
      # it - so the assembly path in app/core/config.py is exercised locally
      # rather than only in production.
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_DIALECT: mysql
      SECRET_KEY: local-compose-development-secret-not-for-production
      # Same-origin through the edge proxy, so this only matters if you call the
      # API directly on :8000 from a browser.
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      LOG_JSON: "true"
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /app/var/documents
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      TEXTRACT_ENABLED: "${TEXTRACT_ENABLED:-false}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
    volumes:
      - document-data:/app/var
    # Exposed directly as well as through the edge, so you can hit the API
    # without the proxy when debugging.
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000
             --proxy-headers --forwarded-allow-ips '*'"

  web:
    build:
      context: ./React
      dockerfile: Dockerfile
      args:
        # Build-time, not runtime: Vite inlines this into the bundle. Changing
        # it requires `docker compose build web`, not just a restart.
        VITE_API_BASE_URL: /api/v1
        NODE_IMAGE: ${NODE_IMAGE:-public.ecr.aws/docker/library/node:20-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-public.ecr.aws/docker/library/nginx:1.27-alpine}
    restart: unless-stopped

  edge:
    image: ${NGINX_IMAGE:-public.ecr.aws/docker/library/nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "8080:80"
    volumes:
      - ./infra/local/edge.nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql-data:
  document-data:
